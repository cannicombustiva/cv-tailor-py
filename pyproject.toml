[project]
name = "cv-tailor-py"
version = "0.1.0"
description = "Tailor a CV profile to a job description"
readme = "README.md"
authors = [
    { name = "Salvatore Difranco", email = "salvatoredifranco8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "autoevals>=0.4.1",
    "braintrust>=0.49.3",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
]

[project.scripts]
cv-tailor-py = "cv_tailor_py.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["cv_tailor_py"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
